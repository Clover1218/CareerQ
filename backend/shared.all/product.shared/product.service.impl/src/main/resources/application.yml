spring:
  application:
    name: careerq-backend
  profiles:
    default: dev
  servlet:
    multipart:
      max-file-size: 3MB
      max-request-size: 4MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      force: true
    session:
      timeout: 7d
      cookie:
        http-only: true
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# SSM：MyBatis 连接 MySQL（dev 为 H2 MySQL 兼容模式）
mybatis:
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: "NULL"

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:careerq;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console

careerq:
  moderation:
    # 未接入 AI 时跳过 L2 调用，按“通过”处理并进入 L3；接入 AI 后改为 false
    l2-auto-pass: true
  sms:
    dev-mode: true
    dev-code: "123456"
  cors:
    # 前端本地开发地址；生产同域反代时留空即可
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5176,http://127.0.0.1:5176

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/careerq?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:careerq}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  servlet:
    session:
      cookie:
        secure: true

careerq:
  moderation:
    # 生产未接入 AI 前保持自动通过；接入后必须改为 false
    l2-auto-pass: ${MODERATION_L2_AUTO_PASS:true}
  sms:
    dev-mode: false
